
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171724">
  <meta name="description" content="LIYA AI — Your personal AI assistant">
  <title>LIYA AI — Personal AI Assistant</title>
  <link rel="manifest" href="/LIYA/manifest.json">
  <link rel="icon" href="/LIYA/icons/liya-192.png" type="image/png">

  <style>
    :root {
      color-scheme: dark;
      --bg: #11111b;
      --panel: #1b1b2b;
      --panel2: #242438;
      --text: #f5f5fa;
      --muted: #a9a9c0;
      --accent: #a78bfa;
      --border: #35354b;
      --danger: #ff9b9b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button, select {
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      width: min(900px, 100%);
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 16px;
      background: #171724f5;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      color: white;
      font-size: 23px;
      font-weight: 800;
    }

    h1 { margin: 0; font-size: 21px; }
    .subtitle { color: var(--muted); font-size: 12px; margin-top: 3px; }

    .button {
      padding: 10px 13px;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .button.primary {
      background: var(--accent);
      color: #171324;
      border-color: transparent;
      font-weight: 700;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .setting label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 6px 2px;
    }

    .setting select {
      width: 100%;
      min-width: 0;
      padding: 10px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .switch-row input { accent-color: var(--accent); }

    #status {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }

    main {
      flex: 1;
      padding: 22px 16px 140px;
    }

    #welcome {
      padding: 38px 10px;
      text-align: center;
    }

    #welcome .big { font-size: 45px; }
    #welcome h2 { margin-bottom: 8px; }
    #welcome p { color: var(--muted); line-height: 1.7; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .suggestions button {
      padding: 10px 12px;
      border-radius: 20px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .message {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      align-items: flex-start;
    }

    .avatar {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--panel2);
      border-radius: 11px;
      font-size: 17px;
    }

    .message.user .avatar { background: #3b3158; }

    .content {
      min-width: 0;
      max-width: calc(100% - 44px);
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message .who {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .message.error .content { color: var(--danger); }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .message-actions button {
      padding: 5px 9px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
    }

    .composer-wrap {
      position: fixed;
      z-index: 4;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px max(15px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 18%);
    }

    .composer {
      width: min(868px, 100%);
      margin: auto;
      padding: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 30px #0004;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      resize: vertical;
      padding: 10px 4px;
      background: transparent;
      color: var(--text);
      border: 0;
      outline: none;
    }

    #messageInput:focus-visible { outline: none; }

    .icon-button {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 18px;
    }

    .icon-button:disabled { opacity: .5; cursor: not-allowed; }

    #micButton.listening {
      background: #a73750;
      border-color: #ff7b95;
    }

    .fineprint {
      width: min(868px, 100%);
      margin: 7px auto 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 560px) {
      header { padding: 12px; }
      .settings { grid-template-columns: 1fr 1fr; }
      .setting.voice-setting { grid-column: 1 / -1; }
      h1 { font-size: 19px; }
      main { padding: 15px 12px 135px; }
      .composer-wrap { padding-left: 9px; padding-right: 9px; }
      .button { padding: 9px 10px; }
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="topline">
      <div class="brand">
        <div class="logo" aria-hidden="true">L</div>
        <div>
          <h1>LIYA AI</h1>
          <div class="subtitle">Your personal AI assistant</div>
        </div>
      </div>
      <button class="button" id="newChatButton" type="button">
        ＋ New chat
      </button>
    </div>

    <div class="settings">
      <div class="setting">
        <label for="inputLanguage">Microphone language</label>
        <select id="inputLanguage">
          <option value="bn-BD">বাংলা</option>
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="hi-IN">हिन्दी</option>
        </select>
      </div>

      <div class="setting">
        <label for="replyLanguage">Voice reply language</label>
        <select id="replyLanguage">
          <option value="auto">Auto detect</option>
          <option value="bn-BD">বাংলা</option>
          <option value="en-US">English</option>
          <option value="hi-IN">हिन्दी</option>
        </select>
      </div>

      <div class="setting voice-setting">
        <label for="voiceSelect">Choose voice</label>
        <select id="voiceSelect">
          <option value="">Browser default voice</option>
        </select>
      </div>
    </div>

    <label class="switch-row">
      <input type="checkbox" id="voiceReply" checked>
      <span>Voice Reply — উত্তর পড়ে শোনাও</span>
    </label>

    <div id="status" role="status" aria-live="polite">
      Ready. LIYA-কে কিছু জিজ্ঞেস করো।
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <section id="welcome">
      <div class="big" aria-hidden="true">✦</div>
      <h2>হ্যালো! আমি LIYA ❤️</h2>
      <p>তোমার প্রশ্ন লিখো অথবা মাইক্রোফোন বাটনে চাপ দিয়ে কথা বলো।<br>
      আমি তোমার প্রশ্নের উত্তর দেওয়ার চেষ্টা করব।</p>
      <div class="suggestions">
        <button type="button" data-prompt="তোমার পরিচয় দাও">তোমার পরিচয় দাও</button>
        <button type="button" data-prompt="Python কী? সহজভাবে বুঝিয়ে বলো।">Python শেখাও</button>
        <button type="button" data-prompt="২ + ২ কত? ব্যাখ্যা করো।">গণিত সমাধান</button>
        <button type="button" data-prompt="আমার জন্য একটি সুন্দর দিনের পরিকল্পনা তৈরি করো।">পরিকল্পনা তৈরি</button>
      </div>
    </section>
  </main>

  <div class="composer-wrap">
    <form class="composer" id="chatForm">
      <button class="icon-button" id="micButton" type="button"
        aria-label="Speak to LIYA" title="Speak to LIYA">🎙️</button>

      <textarea id="messageInput" rows="1" maxlength="4000"
        placeholder="LIYA-কে কিছু জিজ্ঞেস করো..."
        aria-label="Your message"></textarea>

      <button class="icon-button" id="stopVoiceButton" type="button"
        title="Stop voice" aria-label="Stop voice">⏹</button>

      <button class="icon-button" id="sendButton" type="submit"
        aria-label="Send message" title="Send message">➤</button>
    </form>
    <div class="fineprint">
      AI-এর উত্তর ভুল হতে পারে। গুরুত্বপূর্ণ তথ্য যাচাই করে নাও।
    </div>
  </div>
</div>

<script>
"use strict";

const API_URL = "https://liya-ai.thismohammed27.workers.dev/";

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const stopVoiceButton = document.getElementById("stopVoiceButton");
const statusBox = document.getElementById("status");
const inputLanguage = document.getElementById("inputLanguage");
const replyLanguage = document.getElementById("replyLanguage");
const voiceSelect = document.getElementById("voiceSelect");
const voiceReply = document.getElementById("voiceReply");
const newChatButton = document.getElementById("newChatButton");

let recognition = null;
let listening = false;
let currentController = null;
let availableVoices = [];

function setStatus(message) {
  statusBox.textContent = message;
}

function addMessage(role, text, isError = false) {
  welcome.hidden = true;

  const row = document.createElement("article");
  row.className = "message " + role + (isError ? " error" : "");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "👤" : "✦";
  avatar.setAttribute("aria-hidden", "true");

  const body = document.createElement("div");
  body.className = "content";

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "You" : "LIYA";

  const textNode = document.createElement("div");
  textNode.textContent = text;

  body.append(who, textNode);

  if (role === "assistant" && !isError) {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const speak = document.createElement("button");
    speak.type = "button";
    speak.textContent = "🔊 Speak";
    speak.addEventListener("click", () => speakText(text));

    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "Copy";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
        setStatus("উত্তর কপি হয়েছে।");
      } catch {
        setStatus("কপি করা যায়নি। উত্তরটি ম্যানুয়ালি সিলেক্ট করো।");
      }
    });

    actions.append(speak, copy);
    body.append(actions);
  }

  row.append(avatar, body);
  chat.append(row);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

  return row;
}

function getVoiceLanguage(text) {
  const selected = replyLanguage.value;
  if (selected !== "auto") return selected;

  if (/[\u0980-\u09FF]/.test(text)) return "bn-BD";
  if (/[\u0900-\u097F]/.test(text)) return "hi-IN";
  return "en-US";
}

function loadVoices() {
  if (!("speechSynthesis" in window)) return;

  availableVoices = speechSynthesis.getVoices();
  const previous = voiceSelect.value;

  voiceSelect.replaceChildren();

  const defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = "Browser default voice";
  voiceSelect.append(defaultOption);

  availableVoices.forEach((voice, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent =
      voice.name + " (" + voice.lang + ")" +
      (voice.default ? " — default" : "");
    voiceSelect.append(option);
  });

  if ([...voiceSelect.options].some(option => option.value === previous)) {
    voiceSelect.value = previous;
  }
}

if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
} else {
  voiceReply.checked = false;
  voiceReply.disabled = true;
  setStatus("এই ব্রাউজারে speech synthesis সমর্থিত নয়।");
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    setStatus("এই ব্রাউজারে voice reply সমর্থিত নয়।");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = getVoiceLanguage(text);
  utterance.rate = 1;
  utterance.pitch = 1;

  const selectedIndex = voiceSelect.value;
  if (selectedIndex !== "" && availableVoices[Number(selectedIndex)]) {
    utterance.voice = availableVoices[Number(selectedIndex)];
  } else {
    const prefix = utterance.lang.toLowerCase().split("-")[0];
    const matchingVoice = availableVoices.find(voice =>
      voice.lang.toLowerCase().startsWith(prefix)
    );
    if (matchingVoice) utterance.voice = matchingVoice;
  }

  utterance.onstart = () => setStatus("LIYA কথা বলছে...");
  utterance.onend = () => setStatus("Ready.");
  utterance.onerror = () => setStatus("ভয়েস চালানো যায়নি। অন্য voice নির্বাচন করো।");

  speechSynthesis.speak(utterance);
}

function stopListening() {
  if (recognition && listening) {
    try { recognition.stop(); } catch {}
  }
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setStatus("এই ব্রাউজারে speech recognition নেই। আপডেটেড Chrome ব্যবহার করে দেখো।");
    return;
  }

  if (listening) {
    stopListening();
    return;
  }

  if ("speechSynthesis" in window) speechSynthesis.cancel();

  recognition = new SpeechRecognition();
  recognition.lang = inputLanguage.value;
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let finalTranscript = "";

  recognition.onstart = () => {
    listening = true;
    micButton.classList.add("listening");
    micButton.textContent = "⏹";
    setStatus("শুনছি... এখন কথা বলো।");
  };

  recognition.onresult = event => {
    let interim = "";
    finalTranscript = "";

    for (let i = 0; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += transcript;
      } else {
        interim += transcript;
      }
    }

    input.value = finalTranscript || interim;
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
  };

  recognition.onerror = event => {
    const messages = {
      "not-allowed": "মাইক্রোফোনের অনুমতি দাও।",
      "no-speech": "কোনো কথা শোনা যায়নি। আবার চেষ্টা করো।",
      "audio-capture": "মাইক্রোফোন পাওয়া যায়নি।",
      "network": "Speech recognition-এর জন্য নেটওয়ার্ক সমস্যা হয়েছে."
    };
    setStatus(messages[event.error] || ("Voice error: " + event.error));
  };

  recognition.onend = () => {
    listening = false;
    micButton.classList.remove("listening");
    micButton.textContent = "🎙️";

    const spokenText = input.value.trim();
    if (spokenText) {
      setStatus("তোমার কথা পাওয়া গেছে। উত্তর তৈরি হচ্ছে...");
      form.requestSubmit();
    } else {
      setStatus("Ready. আবার কথা বলতে মাইক্রোফোন চাপো।");
    }
  };

  try {
    recognition.start();
  } catch {
    setStatus("মাইক্রোফোন চালু করা যায়নি। একটু পরে আবার চেষ্টা করো।");
  }
}

async function sendMessage(text) {
  const cleanText = text.trim();
  if (!cleanText) return;

  stopListening();
  if ("speechSynthesis" in window) speechSynthesis.cancel();

  addMessage("user", cleanText);
  input.value = "";
  input.style.height = "auto";
  sendButton.disabled = true;
  micButton.disabled = true;
  currentController = new AbortController();

  const timeout = setTimeout(() => {
    currentController?.abort();
  }, 60000);

  setStatus("LIYA উত্তর তৈরি করছে...");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: cleanText }),
      signal: currentController.signal
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || ("HTTP error " + response.status));
    }

    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("AI কোনো উত্তর দেয়নি।");
    }

    addMessage("assistant", data.reply);

    if (voiceReply.checked) speakText(data.reply);
    else setStatus("উত্তর প্রস্তুত।");

  } catch (error) {
    const message = error.name === "AbortError"
      ? "অনুরোধের সময় শেষ হয়েছে বা বাতিল হয়েছে। আবার চেষ্টা করো।"
      : error.message || "সংযোগে সমস্যা হয়েছে।";

    addMessage("assistant", message, true);
    setStatus("উত্তর পাওয়া যায়নি। ইন্টারনেট ও Worker পরীক্ষা করো।");
    console.error("LIYA request error:", error);

  } finally {
    clearTimeout(timeout);
    currentController = null;
    sendButton.disabled = false;
    micButton.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  sendMessage(input.value);
});

micButton.addEventListener("click", startListening);

stopVoiceButton.addEventListener("click", () => {
  stopListening();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  setStatus("Voice বন্ধ করা হয়েছে।");
});

newChatButton.addEventListener("click", () => {
  stopListening();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (currentController) currentController.abort();

  chat.replaceChildren();
  chat.append(welcome);
  welcome.hidden = false;
  input.value = "";
  input.focus();
  setStatus("নতুন চ্যাট শুরু হয়েছে।");
});

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    sendMessage(button.dataset.prompt);
  });
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/LIYA/sw.js")
      .catch(error => console.error("Service Worker error:", error));
  });
}
</script>
</body>
</html>
