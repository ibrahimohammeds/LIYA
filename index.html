<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10152f">
  <title>LIYA AI</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151c35; --line:#2a3558; --accent:#7c5cff; --text:#f5f6ff; --muted:#aab4d4; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(160deg,#0b1020,#151238); color:var(--text); min-height:100vh; }
    .app { width:min(900px,100%); margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:16px; gap:14px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; background:#151c35; border:1px solid var(--line); border-radius:18px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.25rem; }
    .logo { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:linear-gradient(135deg,#7c5cff,#12c8e8); font-size:1.25rem; }
    button,select,textarea { font:inherit; }
    button { cursor:pointer; border:0; border-radius:12px; padding:11px 14px; color:white; background:var(--accent); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .secondary { background:#263153; border:1px solid var(--line); }
    .settings { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .setting { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
    label { display:block; color:var(--muted); font-size:.9rem; margin-bottom:7px; }
    select { width:100%; background:#0d1429; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; }
    .toggle { display:flex; align-items:center; gap:9px; margin-top:10px; color:var(--text); }
    .toggle input { width:18px; height:18px; }
    #status { color:var(--muted); font-size:.88rem; padding:0 4px; }
    #chat { display:flex; flex-direction:column; gap:12px; flex:1; min-height:240px; padding:4px 0 12px; }
    .welcome { text-align:center; margin:auto; padding:30px 12px; color:var(--muted); }
    .welcome h1 { color:white; margin-bottom:8px; }
    .message { max-width:85%; padding:12px 14px; border-radius:16px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
    .user { align-self:flex-end; background:#5944bf; border-bottom-right-radius:5px; }
    .assistant { align-self:flex-start; background:#18213d; border:1px solid var(--line); border-bottom-left-radius:5px; }
    .composer { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:10px; }
    form { display:flex; align-items:flex-end; gap:8px; }
    textarea { flex:1; resize:vertical; min-height:46px; max-height:160px; color:var(--text); background:#0d1429; border:1px solid var(--line); border-radius:12px; padding:12px; outline:none; }
    textarea:focus,select:focus { border-color:#8c79ff; }
    .tools { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
    .hint { color:var(--muted); font-size:.8rem; text-align:center; }
    @media(max-width:560px) { .app{padding:10px} header{padding:11px} .settings{grid-template-columns:1fr} .message{max-width:94%} form{flex-wrap:wrap} textarea{flex-basis:100%} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><div class="logo">✦</div><div>LIYA AI<div style="font-size:.75rem;color:#aab4d4;font-weight:500">তোমার AI সহকারী</div></div></div>
      <button id="newChatButton" class="secondary" type="button">নতুন চ্যাট</button>
    </header>

    <section class="settings" aria-label="Voice settings">
      <div class="setting">
        <label for="voiceLanguage">কথা বলার ভাষা / Voice</label>
        <select id="voiceLanguage">
          <option value="bn">বাংলা নারী কণ্ঠ</option>
          <option value="en">English female voice</option>
        </select>
        <label class="toggle"><input id="voiceReply" type="checkbox" checked> LIYA-র উত্তর শব্দ করে শোনাও</label>
      </div>
      <div class="setting">
        <label for="inputLanguage">মাইক্রোফোনের ভাষা</label>
        <select id="inputLanguage">
          <option value="bn-BD">বাংলা (বাংলাদেশ)</option>
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="hi-IN">हिन्दी</option>
        </select>
        <div class="tools">
          <button id="testVoiceButton" class="secondary" type="button">ভয়েস পরীক্ষা</button>
          <button id="stopVoiceButton" class="secondary" type="button">শব্দ বন্ধ</button>
        </div>
      </div>
    </section>

    <div id="status" role="status">LIYA প্রস্তুত হচ্ছে…</div>
    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>হ্যালো! আমি LIYA ❤️</h1>
        <p>আমাকে বাংলায় বা ইংরেজিতে যেকোনো প্রশ্ন করতে পারো।</p>
      </div>
    </section>

    <section class="composer">
      <form id="chatForm">
        <textarea id="messageInput" rows="1" placeholder="এখানে লিখো…" required></textarea>
        <button id="micButton" class="secondary" type="button" title="কথা বলে লিখুন">🎙️</button>
        <button id="sendButton" type="submit">পাঠাও ➤</button>
      </form>
      <div class="tools">
        <button class="secondary quick" type="button" data-prompt="হ্যালো LIYA, তুমি কেমন আছো?">হ্যালো</button>
        <button class="secondary quick" type="button" data-prompt="তুমি কী কী করতে পারো?">তুমি কী করতে পারো?</button>
      </div>
    </section>
    <div class="hint">কাস্টম voice পেতে হলে আপনার ডিভাইস/ব্রাউজারে সেই ভাষার TTS voice উপলব্ধ থাকতে হবে।</div>
  </main>

<script>
(() => {
  "use strict";
  const API_URL = "https://liya-ai.thismohammed27.workers.dev/";
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const status = document.getElementById("status");
  const voiceLanguage = document.getElementById("voiceLanguage");
  const voiceReply = document.getElementById("voiceReply");
  const inputLanguage = document.getElementById("inputLanguage");
  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  let availableVoices = [];
  let recognition = null;

  function setStatus(message) { status.textContent = message; }

  function refreshVoices() {
    if (!synth) {
      setStatus("এই ব্রাউজারে speech synthesis সমর্থিত নয়।");
      return;
    }
    availableVoices = synth.getVoices();
    if (availableVoices.length) {
      setStatus("Voice পাওয়া গেছে: " + availableVoices.length + "টি। ভয়েস পরীক্ষা করো।");
    } else {
      setStatus("ব্রাউজারে voice list ফাঁকা। Windows/Chrome-এ voice যোগ না করা পর্যন্ত কথা নাও শোনা যেতে পারে।");
    }
  }

  function chooseVoice(language) {
    const voices = availableVoices.length ? availableVoices : (synth ? synth.getVoices() : []);
    if (language === "bn") {
      return voices.find(v => /^bn([-_]|$)/i.test(v.lang) || /bengali|bangla/i.test(v.name)) || null;
    }
    const english = voices.filter(v => /^en([-_]|$)/i.test(v.lang));
    return english.find(v => /female|zira|jenny|aria|samantha|susan|hazel/i.test(v.name)) ||
           english.find(v => v.default) || english[0] || null;
  }

  function speakText(text) {
    if (!synth || !text) {
      setStatus("এই ব্রাউজারে voice output সমর্থিত নয়।");
      return;
    }
    synth.cancel();
    const lang = voiceLanguage.value;
    const voice = chooseVoice(lang);
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = voice ? voice.lang : (lang === "bn" ? "bn-BD" : "en-US");
    if (voice) utterance.voice = voice;
    utterance.rate = 0.94;
    utterance.pitch = 1.08;
    utterance.onstart = () => setStatus("কথা বলছে" + (voice ? ": " + voice.name : " (ডিফল্ট voice)") + "…");
    utterance.onend = () => setStatus("LIYA প্রস্তুত।");
    utterance.onerror = (event) => setStatus("Voice চালানো যায়নি (" + event.error + ")। Voice list বা browser settings পরীক্ষা করো।");
    synth.speak(utterance);
  }

  function addMessage(text, role) {
    if (welcome && welcome.isConnected) welcome.remove();
    const div = document.createElement("div");
    div.className = "message " + role;
    div.textContent = text;
    chat.appendChild(div);
    div.scrollIntoView({behavior:"smooth", block:"end"});
    return div;
  }

  async function sendMessage(text) {
    const message = (text || input.value).trim();
    if (!message) return;
    addMessage(message, "user");
    input.value = "";
    sendButton.disabled = true;
    setStatus("LIYA উত্তর তৈরি করছে…");
    const waiting = addMessage("একটু অপেক্ষা করো…", "assistant");
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
      const reply = typeof data.reply === "string" ? data.reply : "দুঃখিত, উত্তর পাওয়া যায়নি।";
      waiting.textContent = reply;
      setStatus("LIYA প্রস্তুত।");
      if (voiceReply.checked) speakText(reply);
    } catch (error) {
      waiting.textContent = "দুঃখিত, সার্ভারের সঙ্গে সংযোগ করা যায়নি। ইন্টারনেট ও Worker URL পরীক্ষা করো।";
      setStatus("সংযোগ সমস্যা: " + error.message);
      console.error("LIYA request failed:", error);
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    sendMessage();
  });

  document.querySelectorAll(".quick").forEach(button => {
    button.addEventListener("click", () => sendMessage(button.dataset.prompt));
  });

  document.getElementById("newChatButton").addEventListener("click", () => {
    chat.innerHTML = "";
    const intro = document.createElement("div");
    intro.className = "welcome";
    intro.id = "welcome";
    intro.innerHTML = "<h1>হ্যালো! আমি LIYA ❤️</h1><p>আমাকে বাংলায় বা ইংরেজিতে যেকোনো প্রশ্ন করতে পারো।</p>";
    chat.appendChild(intro);
    if (synth) synth.cancel();
    setStatus("নতুন চ্যাট শুরু হয়েছে।");
  });

  document.getElementById("stopVoiceButton").addEventListener("click", () => {
    if (synth) synth.cancel();
    setStatus("Voice বন্ধ করা হয়েছে।");
  });

  document.getElementById("testVoiceButton").addEventListener("click", () => {
    const sample = voiceLanguage.value === "bn"
      ? "হ্যালো, আমি লিয়া। তোমাকে স্বাগতম।"
      : "Hello, I am LIYA. Welcome!";
    refreshVoices();
    speakText(sample);
  });

  document.getElementById("micButton").addEventListener("click", () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      setStatus("এই ব্রাউজারে voice typing নেই। Chrome-এ চেষ্টা করো অথবা টাইপ করো।");
      return;
    }
    if (recognition) {
      recognition.stop();
      recognition = null;
    }
    recognition = new SpeechRecognition();
    recognition.lang = inputLanguage.value;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => setStatus("শুনছি… এখন কথা বলো।");
    recognition.onresult = event => {
      input.value = event.results[0][0].transcript;
      input.focus();
      setStatus("কথা লেখা হয়েছে। পাঠাতে পারো।");
    };
    recognition.onerror = event => setStatus("মাইক্রোফোন সমস্যা: " + event.error);
    recognition.onend = () => { recognition = null; };
    recognition.start();
  });

  if (synth) {
    refreshVoices();
    synth.addEventListener("voiceschanged", refreshVoices);
    // Some browsers populate their voice list shortly after page load.
    setTimeout(refreshVoices, 1000);
  } else {
    setStatus("এই ব্রাউজারে speech synthesis সমর্থিত নয়।");
  }
})();
</script>
</body>
</html>
