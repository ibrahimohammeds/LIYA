
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11111b">
  <meta name="description" content="LIYA AI — তোমার ব্যক্তিগত AI assistant। বাংলায় ও ইংরেজিতে কথা বলো।">
  <title>LIYA AI — Your Personal AI Assistant</title>

  <link rel="manifest" href="/LIYA/manifest.json">
  <link rel="icon" href="/LIYA/icons/liya-192.png" type="image/png">

  <style>
    :root {
      color-scheme: dark;
      --bg: #11111b;
      --panel: #191927;
      --surface: #242438;
      --border: #35354c;
      --text: #f5f3ff;
      --muted: #aaa8c1;
      --purple: #8b5cf6;
      --pink: #ec4899;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans Bengali", sans-serif;
    }

    button, textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      font-size: 25px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: .3px;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .connection {
      color: #c4b5fd;
      font-size: 12px;
      white-space: nowrap;
    }

    .clear-btn {
      padding: 8px 10px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }

    .clear-btn:hover {
      color: white;
      background: var(--surface);
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 17px;
      padding: 24px 20px;
      scroll-behavior: smooth;
    }

    .welcome {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 25px 12px;
      text-align: center;
    }

    .welcome-icon {
      font-size: 55px;
    }

    .welcome h2 {
      margin: 16px 0 10px;
      font-size: 28px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
    }

    .suggestion {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: #ded8ff;
      background: #222235;
      cursor: pointer;
      font-size: 12px;
    }

    .suggestion:hover {
      border-color: var(--purple);
    }

    .msg {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #7051d8;
      border-bottom-right-radius: 5px;
    }

    .bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    .bot.error {
      color: #fecaca;
      border-color: #7f303f;
    }

    .bot.pending {
      color: #c4b5fd;
    }

    .message-label {
      margin-bottom: 5px;
      color: #c4b5fd;
      font-size: 11px;
      font-weight: bold;
    }

    .composer {
      padding: 14px 16px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px;
      border: 1px solid #41415b;
      border-radius: 19px;
      background: #222233;
    }

    .input-row:focus-within {
      border-color: var(--purple);
    }

    #input {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 44px;
      max-height: 150px;
      padding: 12px 10px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      line-height: 1.5;
      font-size: 15px;
    }

    #input::placeholder {
      color: #9694ad;
    }

    #sendBtn {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple), #7041dc);
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    #sendBtn:disabled {
      opacity: .5;
      cursor: wait;
    }

    .footer-note {
      margin: 9px 0 0;
      text-align: center;
      color: #82819b;
      font-size: 11px;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 4px;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c4b5fd;
      animation: pulse 1s infinite alternate;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes pulse {
      from { opacity: .3; transform: translateY(0); }
      to { opacity: 1; transform: translateY(-3px); }
    }

    @media (max-width: 520px) {
      header {
        padding: 13px 12px;
        gap: 9px;
      }

      .logo {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }

      .brand h1 {
        font-size: 19px;
      }

      .brand p {
        font-size: 11px;
      }

      .header-actions {
        gap: 6px;
      }

      .connection {
        display: none;
      }

      .clear-btn {
        padding: 8px;
      }

      #messages {
        padding: 18px 12px;
      }

      .msg {
        max-width: 93%;
        font-size: 14px;
      }

      .welcome h2 {
        font-size: 24px;
      }

      .composer {
        padding-left: 10px;
        padding-right: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">💜</div>

      <div class="brand">
        <h1>LIYA AI</h1>
        <p>Your Personal AI Assistant</p>
      </div>

      <div class="header-actions">
        <span class="connection" id="connection">AI Assistant</span>
        <button class="clear-btn" id="clearBtn" type="button">
          New chat
        </button>
      </div>
    </header>

    <section id="messages" aria-live="polite" aria-label="Chat messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon" aria-hidden="true">✨</div>
        <h2>হ্যালো! আমি LIYA</h2>
        <p>
          তোমার ব্যক্তিগত AI assistant। আমাকে বাংলায় বা ইংরেজিতে
          যেকোনো প্রশ্ন করতে পারো।
        </p>

        <div class="suggestions">
          <button class="suggestion" type="button"
            data-prompt="তোমার পরিচয় দাও।">
            👋 তোমার পরিচয় দাও
          </button>

          <button class="suggestion" type="button"
            data-prompt="9 + 9 কত?">
            🧮 9 + 9 কত?
          </button>

          <button class="suggestion" type="button"
            data-prompt="আমাকে একটি নতুন ব্যবসার আইডিয়া দাও।">
            💡 ব্যবসার আইডিয়া
          </button>
        </div>
      </div>
    </section>

    <form class="composer" id="chatForm">
      <div class="input-row">
        <textarea
          id="input"
          rows="1"
          maxlength="4000"
          placeholder="LIYA-কে কিছু জিজ্ঞেস করো..."
          aria-label="তোমার মেসেজ"
          autocomplete="off"
          required
        ></textarea>

        <button id="sendBtn" type="submit" aria-label="Send message">
          ➤
        </button>
      </div>

      <p class="footer-note">
        LIYA AI ভুল করতে পারে। গুরুত্বপূর্ণ তথ্য যাচাই করে নাও।
      </p>
    </form>
  </main>

  <script>
    "use strict";

    // তোমার Cloudflare Worker API
    const API_URL = "https://liya-ai.thismohammed27.workers.dev/";

    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const connectionEl = document.getElementById("connection");

    let isSending = false;
    let requestController = null;

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, role, extraClass = "") {
      const div = document.createElement("div");
      div.className = `msg ${role} ${extraClass}`.trim();

      if (role === "bot") {
        const label = document.createElement("div");
        label.className = "message-label";
        label.textContent = "LIYA";
        div.appendChild(label);
      }

      const content = document.createElement("div");
      content.textContent = text;
      div.appendChild(content);

      messagesEl.appendChild(div);
      scrollToBottom();

      return { element: div, content };
    }

    function addTypingIndicator() {
      const div = document.createElement("div");
      div.className = "msg bot pending";
      div.setAttribute("role", "status");
      div.setAttribute("aria-label", "LIYA is thinking");

      const label = document.createElement("div");
      label.className = "message-label";
      label.textContent = "LIYA";

      const content = document.createElement("div");
      content.append("LIYA ভাবছে");

      const dots = document.createElement("span");
      dots.className = "typing-dots";

      for (let i = 0; i < 3; i++) {
        dots.appendChild(document.createElement("span"));
      }

      content.appendChild(dots);
      div.append(label, content);
      messagesEl.appendChild(div);
      scrollToBottom();

      return div;
    }

    function setSending(value) {
      isSending = value;
      sendBtn.disabled = value;
      input.disabled = value;
      sendBtn.textContent = value ? "…" : "➤";
      connectionEl.textContent = value ? "Thinking…" : "AI Assistant";
    }

    async function sendMessage(message) {
      const text = message.trim();

      if (!text || isSending) return;

      welcomeEl.style.display = "none";
      addMessage(text, "user");

      input.value = "";
      input.style.height = "auto";
      setSending(true);

      const loading = addTypingIndicator();
      requestController = new AbortController();

      const timeoutId = setTimeout(() => {
        requestController.abort();
      }, 60000);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: text }),
          signal: requestController.signal
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("সার্ভার থেকে সঠিক উত্তর পাওয়া যায়নি।");
        }

        if (!response.ok) {
          throw new Error(
            typeof data.error === "string"
              ? data.error
              : `Server error (${response.status})`
          );
        }

        if (typeof data.reply !== "string" || !data.reply.trim()) {
          throw new Error("AI কোনো উত্তর দেয়নি। আবার চেষ্টা করো।");
        }

        loading.remove();
        addMessage(data.reply.trim(), "bot");
      } catch (error) {
        loading.remove();

        let errorMessage;

        if (error.name === "AbortError") {
          errorMessage =
            "উত্তর পেতে বেশি সময় লাগছে। ইন্টারনেট পরীক্ষা করে আবার চেষ্টা করো।";
        } else if (error instanceof TypeError) {
          errorMessage =
            "LIYA-এর সার্ভারে সংযোগ করা যাচ্ছে না। ইন্টারনেট, Worker URL ও CORS সেটিংস পরীক্ষা করো।";
        } else {
          errorMessage =
            "দুঃখিত, এই অনুরোধটি সম্পন্ন হয়নি। " +
            (error.message || "আবার চেষ্টা করো।");
        }

        addMessage(errorMessage, "bot", "error");
        console.error("LIYA request failed:", error);
      } finally {
        clearTimeout(timeoutId);
        requestController = null;
        setSending(false);
        input.focus();
        scrollToBottom();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height =
        Math.min(input.scrollHeight, 150) + "px";
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();

        if (!isSending) {
          form.requestSubmit();
        }
      }
    });

    document.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => {
        if (isSending) return;

        input.value = button.dataset.prompt;
        input.focus();
        form.requestSubmit();
      });
    });

    clearBtn.addEventListener("click", () => {
      if (isSending) {
        if (requestController) {
          requestController.abort();
        }
        return;
      }

      messagesEl.replaceChildren();
      messagesEl.appendChild(welcomeEl);
      welcomeEl.style.display = "";
      input.value = "";
      input.style.height = "auto";
      input.focus();
    });

    // Register the Service Worker for GitHub Pages.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/LIYA/sw.js")
          .catch(error => {
            console.error("Service Worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
